services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx 
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - YOUR_NETWORK
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"] #TODO: change this check to default for nginx
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s

networks:
  YOUR_NETWORK:
    name: YOUR_NETWORK
    driver: bridge
